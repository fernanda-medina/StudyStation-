name: CI - Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Padrão de código (Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --prefer-dist
      - name: Pint (informativo até o código antigo ser formatado)
        run: vendor/bin/pint --test
        continue-on-error: true

  testes:
    name: Testes unitários + integração + cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: PHPUnit com cobertura mínima de 70%
        run: php artisan test --coverage --min=70 --coverage-clover=coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: api/coverage.xml

  e2e:
    name: Teste E2E (Playwright)
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sobe a API com banco SQLite
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env && php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan serve --host=127.0.0.1 --port=8000 &
      - name: Sobe o front-end
        run: npx --yes http-server frontend -p 5500 -s &
      - name: Instala e executa o Playwright
        run: |
          npm i -D @playwright/test
          npx playwright install --with-deps chromium
          npx wait-on http://127.0.0.1:8000/up http://127.0.0.1:5500/estudaflow.html
          npx playwright test --config e2e/playwright.config.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
